<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>김석호 포트폴리오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08090b; --ink:#f3f4f6; --mute:#8a9099; --line:rgba(255,255,255,.12);
  --pass:#4fe3b0; --gut:clamp(20px,5vw,72px);
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.6;word-break:keep-all;-webkit-font-smoothing:antialiased}
main{min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;padding:96px var(--gut) clamp(28px,5vh,56px)}
.eyebrow{font-size:13px;letter-spacing:.1em;color:var(--mute)}
h1{font-size:clamp(96px,21vw,340px);font-weight:900;line-height:.92;letter-spacing:-.04em;margin:8px 0 0 -.04em}
.say{margin-top:clamp(18px,3vh,32px);font-size:clamp(20px,2.6vw,40px);font-weight:700;line-height:1.35;letter-spacing:-.02em}
nav{margin-top:clamp(32px,6vh,72px);display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
nav a{display:block;padding:clamp(20px,3.4vh,36px) clamp(16px,2vw,32px) clamp(20px,3.4vh,36px) 0;color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}
nav a + a{padding-left:clamp(16px,2vw,32px);border-left:1px solid var(--line)}
nav i{display:block;font:500 12px ui-monospace,Consolas,monospace;font-style:normal;letter-spacing:.04em;color:var(--mute)}
nav b{display:block;margin-top:8px;font-size:clamp(24px,3vw,46px);font-weight:900;letter-spacing:-.03em;line-height:1.2}
nav b::after{content:"→";display:inline-block;margin-left:.35em;color:var(--pass);transition:transform .2s}
nav a:hover b::after,nav a:focus-visible b::after{transform:translateX(.25em)}
nav span{display:block;margin-top:10px;max-width:30em;font-size:clamp(14px,1.15vw,17px);color:#b9bec6}
nav a:focus-visible{outline:2px solid var(--pass);outline-offset:-2px}
.contact{margin-top:clamp(20px,3.4vh,36px);display:flex;gap:clamp(16px,2.4vw,36px);flex-wrap:wrap;font-size:clamp(14px,1.1vw,17px)}
.contact a{color:var(--mute);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:2px}
@media (max-width:700px){
  nav{grid-template-columns:1fr}
  nav a + a{padding-left:0;border-left:0}
}
@media (prefers-reduced-motion:reduce){nav b::after{transition:none}}
</style>
</head>
<body>
<main>
  <p class="eyebrow">게임 클라이언트 프로그래머</p>
  <h1>김석호</h1>
  <p class="say">같은 프로젝트를 두 가지 관점으로 정리했습니다.</p>
  <nav aria-label="포트폴리오">
    <a href="cpp-portfolio/">
      <i>C++ · DirectX 11 · HLSL</i>
      <b>구현과 문제 해결</b>
      <span>이펙트 시스템과 툴, 충돌 판정, 그림자 렌더링을 어떻게 구현했고 막힌 문제를 어떻게 풀었는지 담았습니다.</span>
    </a>
    <a href="ai-portfolio/">
      <i>Claude Code · Codex · Unity MCP</i>
      <b>AI 협업 방식</b>
      <span>설계 · 결정 · 검증은 직접 맡고, 조사 · 작성 · 반복 작업은 AI에 단계별로 맡긴 과정을 담았습니다.</span>
    </a>
  </nav>
  <p class="contact"><a href="mailto:ksh66020@gmail.com">ksh66020@gmail.com</a><a href="https://github.com/shKim-33">github.com/shKim-33</a></p>
</main>
</body>
</html>
